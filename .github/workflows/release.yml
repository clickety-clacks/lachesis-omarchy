name: Verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check plugin
        shell: bash
        run: |
          bash -n fetch.sh
          node forecast.test.js
          jq -e '.schemaVersion == 1 and .id == "mike.lachesis-usage" and (.version | test("^[0-9]+[.][0-9]+[.][0-9]+$"))' manifest.json >/dev/null
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$(jq -r '.version' manifest.json)" == "${GITHUB_REF_NAME#v}" ]]
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
